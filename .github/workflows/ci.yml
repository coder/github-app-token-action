name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.32.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No dependencies
        # The action runs src/ directly; anything it imports must be part of Node.
        run: |
          if grep -rhoE "from \"[^\"]+\"" src | grep -vE "from \"(node:[a-z/_]+|\./[a-z]+\.mjs)\""; then
            echo "::error::src/ may only import node: built-ins and its own files"
            exit 1
          fi
      - name: Test
        run: node --test

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # online audits (impostor commits, known-vulnerable actions)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github/
