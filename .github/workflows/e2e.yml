name: e2e

# Mints a real token with a test App whose key is in Cloud KMS. The Google Cloud side only lets
# this workflow sign, from the e2e environment on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  token:
    runs-on: ubuntu-latest
    environment: e2e
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: app
        # The checkout above is this commit, so ./ is the code under test. actionlint does not
        # accept the $/ self-repository form yet.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}
          kms-key: ${{ vars.E2E_KMS_KEY }}
          workload-identity-provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          repositories: ${{ github.event.repository.name }}
          permissions: |
            contents: read

      - name: The token reaches only this repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          repos=$(gh api installation/repositories --jq '[.repositories[].full_name] | join(",")')
          if [[ "$repos" != "$REPO" ]]; then
            echo "::error::expected only $REPO, got: $repos"
            exit 1
          fi
          gh api "repos/$REPO/contents/action.yml" --jq .name

      - name: The token cannot write
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/e2e-should-fail -f sha="$GITHUB_SHA" 2>/dev/null; then
            echo "::error::a contents: read token created a branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/e2e-should-fail" || true
            exit 1
          fi

      - name: Revoking the token works
        # The post step only warns when revocation fails and runs after every check, so this runs
        # its code now and checks GitHub rejects the token afterwards. The post step's own DELETE
        # then gets 401, which it accepts.
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          API_URL: ${{ github.api_url }}
        run: |
          node --input-type=module -e '
            import { post } from "./src/lib.mjs";
            await post({ env: { STATE_token: process.env.TOKEN, STATE_api_url: process.env.API_URL } });
          '
          if GH_TOKEN="$TOKEN" gh api installation/repositories >/dev/null 2>&1; then
            echo "::error::the token still works after it was revoked"
            exit 1
          fi
